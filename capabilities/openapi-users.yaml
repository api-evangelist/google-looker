naftiko: 1.0.0-alpha2
info:
  label: Google Looker API — Users
  description: 'Google Looker API — Users. 2 operations. Lead operation: Get Current User. Self-contained Naftiko capability
    covering one Google Looker business surface.'
  tags:
  - Google Looker
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_LOOKER_API_KEY: GOOGLE_LOOKER_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-users
    baseUri: https://your-instance.cloud.looker.com:19999/api/4.0
    description: Google Looker API — Users business capability. Self-contained, no shared references.
    resources:
    - name: user
      path: /user
      operations:
      - name: getcurrentuser
        method: GET
        description: Get Current User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users
      path: /users
      operations:
      - name: getallusers
        method: GET
        description: Get All Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number to retrieve when paginating user results.
        - name: per_page
          in: query
          type: integer
          description: Number of user records to return per page.
    authentication:
      type: bearer
      token: '{{env.GOOGLE_LOOKER_API_KEY}}'
  exposes:
  - type: rest
    namespace: openapi-users-rest
    port: 8080
    description: REST adapter for Google Looker API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/user
      name: user
      description: REST surface for user.
      operations:
      - method: GET
        name: getcurrentuser
        description: Get Current User
        call: openapi-users.getcurrentuser
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: getallusers
        description: Get All Users
        call: openapi-users.getallusers
        with:
          page: rest.page
          per_page: rest.per_page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Looker API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-current-user
      description: Get Current User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-users.getcurrentuser
      outputParameters:
      - type: object
        mapping: $.
    - name: get-all-users
      description: Get All Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-users.getallusers
      with:
        page: tools.page
        per_page: tools.per_page
      outputParameters:
      - type: object
        mapping: $.
