      - type: API Explorer
        url: https://cloud.google.com/looker/docs/api-explorer
      - type: Versioning
        url: https://cloud.google.com/looker/docs/api-versioning
  - name: Looker (Google Cloud core) API
    description: >-
      The Looker (Google Cloud core) REST API provides programmatic access to manage Looker instances, backups, and
      operations within Google Cloud projects and locations.
    image: https://cloud.google.com/images/social-icon-google-cloud-1200-630.png
    humanURL: https://cloud.google.com/looker/docs/reference/rest
    baseURL: https://looker.googleapis.com
    tags:
      - Analytics
      - Business Intelligence
      - Cloud Management
      - Instance Management
    properties:
      - type: Documentation
        url: https://cloud.google.com/looker/docs/reference/rest
      - type: OpenAPI
        url: https://looker.googleapis.com/$discovery/rest?version=v1
  - name: Looker Studio API
    description: >-
      The Looker Studio API allows you to search for and manage Looker Studio assets programmatically, enabling
      automation and migration of Looker Studio resources within Google Workspace or Cloud Identity organizations.
    image: https://cloud.google.com/images/social-icon-google-cloud-1200-630.png
    humanURL: https://developers.google.com/looker-studio/integrate/api
    baseURL: https://datastudio.googleapis.com/v1
    tags:
