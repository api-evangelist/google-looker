    description: >-
      The Looker API provides programmatic access to Looker functionality for managing users, content, queries, and
      more.
    image: https://cloud.google.com/images/social-icon-google-cloud-1200-630.png
    humanURL: https://cloud.google.com/looker/docs/api-overview
    baseURL: https://your-instance.cloud.looker.com:19999/api/4.0
